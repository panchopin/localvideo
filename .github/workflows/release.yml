name: Release

# Cut a GitHub Release whenever a version tag is pushed, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# Builds the self-contained .app on a macOS (Apple Silicon) runner, zips it,
# and publishes it as a release asset.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

jobs:
  build-and-release:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg (provides the libav dylibs package.sh bundles)
        run: brew install ffmpeg

      - name: Build self-contained app bundle
        env:
          LOCALVIDEO_VERSION: ${{ github.ref_name }}   # e.g. v0.2.0 -> stamps 0.2.0
        run: bash native/package.sh

      - name: Zip the app
        run: |
          ditto -c -k --keepParent \
            native/build/LocalVideo.app \
            "native/build/LocalVideo-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "native/build/LocalVideo-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
